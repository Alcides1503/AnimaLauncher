<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; media-src 'self' file:; style-src 'self' 'unsafe-inline'">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; font-family: Segoe UI, sans-serif; }
    #wrap { height: 100%; display: flex; flex-direction: column; }
    #thumb { flex: 1; min-height: 0; border-radius: 22px; overflow: hidden; background: #1b1f29; }
    #thumb img, #thumb video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    #name { height: 24px; line-height: 24px; text-align: center; color: #fff; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
  </style>
</head>
<body>
  <div id="wrap"><div id="thumb"></div><div id="name"></div></div>
  <script src="widget.js"></script>
</body>
</html>
